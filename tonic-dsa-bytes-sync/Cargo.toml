[package]
name = "tonic-dsa-bytes-sync"
version = "0.1.0"
authors = ["Lucio Franco <luciofranco14@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hyperium/tonic"
homepage = "https://github.com/hyperium/tonic"
description = "Experimental synchronous DSA bytes codec implementation for tonic"
categories = ["network-programming", "asynchronous"]
keywords = ["rpc", "grpc", "bytes", "dsa", "tonic"]
rust-version = { workspace = true }

[dependencies]
bytes = "1"
idxd-rust = { path = "../../../idxd-rust" }
tonic = { version = "0.14.6", path = "../tonic", default-features = false }


[[bench]]
name = "buf_codec"
harness = false

[dev-dependencies]
bencher = "0.1.5"
http-body = "1"
tokio-stream = "0.1"

[lints]
workspace = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
  "tonic::*",
  "bytes::*",
]
