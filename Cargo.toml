[workspace]
members = [
  "tonic",
  "tonic-build",
  "tonic-health",
  "tonic-protobuf",
  "tonic-types",
  "tonic-reflection",
  "tonic-prost",
  "tonic-prost-async",
  "tonic-dsa-bytes-sync",
  "tonic-dsa-bytes-async",
  "tonic-bytes-bench",
  "tonic-prost-build",
  "tonic-web",
  "examples",
  "codegen",
  "grpc",
  "grpc-google",
  "grpc-protobuf",
  "grpc-protobuf-build",
  "protoc-gen-rust-grpc",
  "xds-client",
  "tonic-xds",
  "interop",
  "tests/disable_comments",
  "tests/wellknown",
  "tests/wellknown-compiled",
  "tests/extern_path/uuid",
  "tests/extern_path/my_application",
  "customized-integration-tests",
  "tests/integration_tests",
  "tests/compression",
  "tests/compile",
  "tests/web",
  "tests/default_stubs",
  "tests/deprecated_methods",
]
resolver = "2"
exclude = ["prost"]

[patch.crates-io]
tonic = { path = "tonic" }
tonic-prost = { path = "tonic-prost" }
prost = { path = "prost/prost" }
prost-build = { path = "prost/prost-build" }
prost-types = { path = "prost/prost-types" }

[workspace.package]
rust-version = "1.88"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
uninlined_format_args = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
